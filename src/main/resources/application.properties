# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Spring Application Name
spring.application.name=ICD-10 Diagnosis Service

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:file:./hospital_db;
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# H2 Console (testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# API Documentation (Swagger/OpenAPI)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,icdData

# External API Configuration
icd10.api.url=http://localhost:8082/api/icd10
icd10.api.timeout=5000
icd10.sync.on-startup=true

# Logging
logging.level.root=INFO
logging.level.mn.hospital=DEBUG
